<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Supported Colors</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    .color-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .color-item {
      width: 140px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #ccc;
    }
    .label {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Browser Supported CSS Color Names</h1>
  <div class="color-grid">
    <!-- Colors will be injected by JavaScript -->
  </div>

  <script>
    const colors = [
      "AliceBlue","AntiqueWhite","Aqua","Aquamarine","Azure","Beige","Bisque","BlanchedAlmond",
      "BlueViolet","Brown","BurlyWood","CadetBlue","Chartreuse","Chocolate","Coral","CornflowerBlue",
      "Cornsilk","Crimson","Cyan","DarkBlue","DarkCyan","DarkGoldenRod","DarkGray","DarkGreen",
      "DarkKhaki","DarkMagenta","DarkOliveGreen","DarkOrange","DarkOrchid","DarkRed","DarkSalmon",
      "DarkSeaGreen","DarkSlateBlue","DarkSlateGray","DarkTurquoise","DarkViolet","DeepPink",
      "DeepSkyBlue","DimGray","DodgerBlue","FireBrick","FloralWhite","ForestGreen","Fuchsia",
      "Gainsboro","GhostWhite","Gold","GoldenRod","Gray","Green","GreenYellow","HoneyDew",
      "HotPink","IndianRed","Indigo","Ivory","Khaki","Lavender","LavenderBlush","LawnGreen",
      "LemonChiffon","LightBlue","LightCoral","LightCyan","LightGoldenRodYellow","LightGray",
      "LightGreen","LightPink","LightSalmon","LightSeaGreen","LightSkyBlue","LightSlateGray",
      "LightSteelBlue","LightYellow","Lime","LimeGreen","Linen","Magenta","Maroon",
      "MediumAquaMarine","MediumBlue","MediumOrchid","MediumPurple","MediumSeaGreen","MediumSlateBlue",
      "MediumSpringGreen","MediumTurquoise","MediumVioletRed","MidnightBlue","MintCream","MistyRose",
      "Moccasin","NavajoWhite","Navy","OldLace","Olive","OliveDrab","Orange","OrangeRed","Orchid",
      "PaleGoldenRod","PaleGreen","PaleTurquoise","PaleVioletRed","PapayaWhip","PeachPuff","Peru",
      "Pink","Plum","PowderBlue","Purple","RebeccaPurple","Red","RosyBrown","RoyalBlue",
      "SaddleBrown","Salmon","SandyBrown","SeaGreen","SeaShell","Sienna","Silver","SkyBlue",
      "SlateBlue","SlateGray","Snow","SpringGreen","SteelBlue","Tan","Teal","Thistle","Tomato",
      "Turquoise","Violet","Wheat","White","WhiteSmoke","Yellow","YellowGreen"
    ];

    const container = document.querySelector('.color-grid');

    colors.forEach(color => {
      const item = document.createElement('div');
      item.className = 'color-item';
      item.innerHTML = `
        <span class="swatch" style="background-color: ${color};"></span>
        <span class="label">${color}</span>
      `;
      container.appendChild(item);
    });
  </script>
</body>
</html>
